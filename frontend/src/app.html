<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CAPost — Zero-Knowledge API Studio</title>
    <script>
      try {
        const theme = localStorage.getItem('caframework-theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      /* Boot splash: plain HTML/CSS so it paints in the very first frame, before any JS bundle. */
      html, body { margin: 0; background: #0e0e0e; }
      html:not(.dark), html:not(.dark) body { background: #f5f5f5; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0e0e0e; color: #e5e5e5;
        font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
        transition: opacity 260ms ease, visibility 260ms ease;
        -webkit-app-region: drag; user-select: none; cursor: default;
      }
      html:not(.dark) #boot-splash { background: #f5f5f5; color: #171717; }
      #boot-splash.is-done { opacity: 0; visibility: hidden; }
      #boot-splash .bs-logo { width: 64px; height: 64px; animation: bs-pulse 1.6s ease-in-out infinite; }
      #boot-splash .bs-logo polygon { stroke: #38bdf8; }
      html:not(.dark) #boot-splash .bs-logo polygon { stroke: #0ea5e9; }
      #boot-splash .bs-name { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      #boot-splash .bs-sub { margin-top: 2px; font-size: 12px; color: #8a8a8a; text-align: center; }
      #boot-splash .bs-track { width: 220px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(127,127,127,.18); }
      #boot-splash .bs-bar { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, #0ea5e9, #38bdf8); transition: width 180ms ease-out; }
      #boot-splash .bs-step { min-height: 16px; font-size: 11.5px; color: #8a8a8a; }
      @keyframes bs-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.96); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bs-logo { animation: none; } }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading CAPost">
      <svg class="bs-logo" viewBox="0 0 512 512" fill="none" aria-hidden="true">
        <polygon points="256,105 412,385 256,315 100,385" fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <div class="bs-name">CAPost</div>
        <div class="bs-sub">API Studio</div>
      </div>
      <div class="bs-track"><div class="bs-bar" id="boot-bar"></div></div>
      <div class="bs-step" id="boot-step">Starting…</div>
    </div>
    <script>
      // Progress creeps toward 90% on its own; the app reports real steps through
      // __capostBoot.step() and finishes with __capostBoot.done(). Hard cap: 3 s.
      (function () {
        var bar = document.getElementById('boot-bar');
        var label = document.getElementById('boot-step');
        var splash = document.getElementById('boot-splash');
        var pct = 0, finished = false;
        function set(p) { pct = Math.max(pct, Math.min(100, p)); if (bar) bar.style.width = pct + '%'; }
        var timer = setInterval(function () { if (pct < 90) set(pct + Math.max(0.6, (90 - pct) * 0.06)); }, 60);
        function done() {
          if (finished) return;
          finished = true;
          clearInterval(timer);
          set(100);
          setTimeout(function () {
            if (splash) splash.classList.add('is-done');
            setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 320);
          }, 140);
        }
        window.__capostBoot = {
          start: performance.now(),
          step: function (text, p) { if (label && text) label.textContent = text; if (typeof p === 'number') set(p); },
          done: done
        };
        setTimeout(done, 3000);
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
