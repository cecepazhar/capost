[app]
name = "CAPost"
slug = "capost"
bundle_id = "com.fathforce.capost"
version = "0.1.0"
accent_color = "indigo"
error_prefix = "CAPOST"
description = "Zero-Knowledge AI-Native API Studio & Workbench for modern backend and QA engineers"

[window]
title = "CAPost"
width = 1280
height = 850
min_width = 900
min_height = 650

[security]
master_password_required = false
profile_pin_enabled = false

[modules]
sample_slice_enabled = false
ai_assistant_enabled = true
pro_licensing_enabled = true
updater_enabled = true
crash_reporting_enabled = true
backup_restore_enabled = true

[roles]
default_role = "member"
allowed_roles = ["owner", "partner", "member", "child"]

[[menus]]
key = "dashboard"
label = "Dashboard"
href = "/dashboard"
icon = "dashboard"
description = "API Studio overview, quick request launcher, active environments"

[[menus]]
key = "requests"
label = "Requests"
href = "/requests"
icon = "globe"
description = "REST, GraphQL, WebSocket, SSE & gRPC HTTP client workbench"

[[menus]]
key = "collections"
label = "Collections"
href = "/collections"
icon = "folder"
description = "OpenCollection YAML, Bruno & Postman compatible API collections"

[[menus]]
key = "environments"
label = "Environments"
href = "/environments"
icon = "shield"
description = "Zero-Knowledge secret management, multi-environment variables"

[[menus]]
key = "runner"
label = "Runner"
href = "/runner"
icon = "monitoring"
description = "Automated collection runner, iteration assertions and performance stats"

[[menus]]
key = "mock"
label = "Mock Server"
href = "/mock"
icon = "code"
description = "Local API mock server generated from JSON schema"

[[menus]]
key = "history"
label = "History"
href = "/history"
icon = "history"
description = "Audit trail, sanitized request execution logs and timing graphs"

[billing]
enabled = true
product_code = "CAPOST"
gcc_base_url = "https://gcc.fathforce.com"
offline_days = 7
refresh_hours = 6
currencies = ["USD"]

[[billing.public_keys]]
kid = "gcc-2026-10"
ed25519 = "Su0nese5LuWHeNPFIz69p0HGUsdT49rnEn82fbtY2S8="
